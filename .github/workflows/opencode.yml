name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  opencode:
    if: |
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      (contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure Git
        run: |
          git config --global url."https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/".insteadOf "https://github.com/"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install opencode
        shell: bash
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Add opencode to PATH
        shell: bash
        run: echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: opencode version (diagnóstico)
        shell: bash
        run: opencode --version

      - name: Run opencode (debug)
        shell: bash
        run: opencode github run
        env:
          MODEL: opencode-go/glm-5.2
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          USE_GITHUB_TOKEN: 'true'
          DEBUG: '*'
          OPENCODE_DEBUG: '1'

  # ── Triage automático de issues nuevos ──
  issue-triage:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
      ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Formatear issue y asignar etiquetas
        shell: bash
        run: |
          set -euo pipefail

          # ── Datos del issue (inyectados vía env, no por interpolación) ──
          REPO="${GITHUB_REPOSITORY}"
          ISSUE_NUMBER="${ISSUE_NUMBER}"
          ISSUE_TITLE="${ISSUE_TITLE}"
          ISSUE_AUTHOR="${ISSUE_AUTHOR}"
          ISSUE_CREATED_AT="${ISSUE_CREATED_AT}"
          ISSUE_BODY="${ISSUE_BODY}"
          DEFAULT_BRANCH="${DEFAULT_BRANCH}"

          # ── Último commit de la branch por defecto ──
          LAST_COMMIT=$(gh api "repos/${REPO}/commits/${DEFAULT_BRANCH}" --jq '.sha' 2>/dev/null | cut -c1-7 || echo "n/d")

          # ── Texto combinado para detección de etiquetas ──
          TEXT=$(printf '%s\n%s' "${ISSUE_TITLE}" "${ISSUE_BODY}")
          TEXT_LOWER=$(printf '%s' "${TEXT}" | tr '[:upper:]' '[:lower:]')

          # ── Definición de etiquetas y palabras clave ──
          # Formato: "nombre|color|regex"
          LABELS_DATA=(
            "bug|d73a4a|\\bbug\\b|\\berror\\b|\\bfallo\\b|\\bfalla\\b|\\bcrash\\b|\\bcuelga\\b|\\bexcepci[oó]n\\b|no funciona|\\broto\\b|\\bglitch\\b"
            "enhancement|a2eeef|\\bfeature\\b|\\bsugerencia\\b|\\bmejora\\b|\\bidea\\b|\\bpropuesta\\b|deber[ií]a|estar[ií]a bueno|\\bagregar\\b|\\ba[ñn]adir\\b"
            "question|d876e3|\\bpregunta\\b|\\bduda\\b|\\bc[oó]mo\\b|\\bayuda\\b|\\bconsulta\\b|no entiendo"
            "documentation|0075ca|\\bdocs\\b|\\bdocumentaci[oó]n\\b|\\breadme\\b|\\bwiki\\b|\\bcomentario\\b"
            "performance|fbca04|\\brendimiento\\b|\\blento\\b|\\blag\\b|\\bfps\\b|\\bframe\\b|\\btarda\\b|\\bstutter\\b"
          )

          # ── Crear y asignar etiquetas según coincidencias ──
          ASSIGN_LABELS=()
          for entry in "${LABELS_DATA[@]}"; do
            name="${entry%%|*}"
            rest="${entry#*|}"
            color="${rest%%|*}"
            regex="${rest#*|}"
            if printf '%s' "${TEXT_LOWER}" | grep -qiE "${regex}"; then
              gh label create "${name}" --color "${color}" --description "Triage automático" 2>/dev/null || true
              ASSIGN_LABELS+=("${name}")
            fi
          done

          if [ ${#ASSIGN_LABELS[@]} -gt 0 ]; then
            LABELS_ARG=$(printf '%s,' "${ASSIGN_LABELS[@]}")
            LABELS_ARG="${LABELS_ARG%,}"
            gh issue edit "${ISSUE_NUMBER}" --repo "${REPO}" --add-label "${LABELS_ARG}"
          fi

          # ── Construir cuerpo formateado ──
          BODY_FILE=$(mktemp)
          {
            echo "> [!NOTE]"
            echo "> Issue formateado automáticamente por la Action de triage. El contenido del autor se conserva íntegro más abajo."
            echo ""
            echo "## 📋 Información automática"
            echo ""
            echo "| Campo | Valor |"
            echo "| --- | --- |"
            echo "| Nº | #${ISSUE_NUMBER} |"
            echo "| Autor | @${ISSUE_AUTHOR} |"
            echo "| Fecha | ${ISSUE_CREATED_AT} |"
            echo "| Repo | \`${REPO}\` |"
            echo "| Branch por defecto | \`${DEFAULT_BRANCH}\` |"
            echo "| Último commit | \`${LAST_COMMIT}\` |"
            echo ""
            echo "## 🔗 Enlaces útiles"
            echo ""
            echo "- [README](../blob/${DEFAULT_BRANCH}/README.md)"
            echo "- [AGENTS.md](../blob/${DEFAULT_BRANCH}/AGENTS.md)"
            echo "- [Todos los issues](../issues)"
            echo ""
            echo "---"
            echo ""
            echo "## 📝 Descripción del autor"
            echo ""
            printf '%s\n' "${ISSUE_BODY}"
            echo ""
            echo "---"
            echo ""
            echo "## 🐛 Pasos para reproducir"
            echo ""
            echo "_Solo aplica si es un bug. Completa si corresponde._"
            echo ""
            echo "1. "
            echo "2. "
            echo "3. "
            echo ""
            echo "### Comportamiento esperado"
            echo ""
            echo "<!-- Qué esperabas que ocurriera -->"
            echo ""
            echo "### Comportamiento actual"
            echo ""
            echo "<!-- Qué ocurrió en su lugar -->"
            echo ""
            echo "## 💻 Entorno"
            echo ""
            echo "_Completa si aplica._"
            echo ""
            echo "- **Navegador:** (ej. Chrome 130, Firefox 131)"
            echo "- **Sistema operativo:** (ej. Windows 11, macOS 15, Ubuntu 24.04)"
            echo "- **Commit / versión:** \`${LAST_COMMIT}\`"
          } > "${BODY_FILE}"

          # ── Actualizar el cuerpo del issue ──
          gh issue edit "${ISSUE_NUMBER}" --repo "${REPO}" --body-file "${BODY_FILE}"

          echo "✅ Issue #${ISSUE_NUMBER} formateado y etiquetado correctamente."